services:
  backend:
    build:
      context: ./backend
    container_name: scantosheet-backend
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DATA_DIR: /data
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      TESSERACT_LANG: ${TESSERACT_LANG:-fra}
      OCR_DPI: ${OCR_DPI:-300}
      MAX_WORKERS: ${MAX_WORKERS:-2}
      ENABLE_PREPROCESSING: ${ENABLE_PREPROCESSING:-true}
      EXTRACT_TABLES_ONLY: ${EXTRACT_TABLES_ONLY:-true}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    volumes:
      - scantosheet-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_API_KEY: ${VITE_API_KEY:-}
    container_name: scantosheet-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  scantosheet-data:
